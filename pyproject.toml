[build-system]
requires = ["setuptools>=61.0,<77.0.0", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ghealth-tools"
dynamic = ["version"]
description = "PPG数据分析命令行工具库"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "health_tools"}
]
keywords = ["ppg", "health", "data-analysis", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "rich>=13.0.0",
    "chardet>=5.0.0",
    "python-pptx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black==24.10.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pandas-stubs>=2.0.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
ghealth_tool = "health_tools.cli:main"

[project.urls]
Homepage = "https://github.com/XiaoPb/health_tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
health_tools = ["rules/**/*.yaml", "rules/**/*.yml", "templates/*.pptx"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 显式固定规则集，避免 ruff 0.16+ 默认规则集扩展（59 -> 413）引入意外报错。
# UP/FA100 等涉及全项目类型注解现代化（需 from __future__ import annotations），
# 后续在单独 PR 中逐步启用。
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "bokeh.*", "ruamel.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["health_tools.core.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:pytest-qt"

[tool.coverage.run]
source = ["health_tools"]

[tool.coverage.report]
show_missing = true

[tool.setuptools_scm]
write_to = "src/health_tools/_version.py"
