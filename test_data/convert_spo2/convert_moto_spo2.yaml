version: '1.0'
description: Moto SPO2原始数据转换为gh3036_moto_spo2格式，并合并血氧金标
target_chip: gh3036_moto_spo2
csv:
  info_row: 1
  header_row: 2
  data_start_row: 3
  delimiter: ','
column_mapping:
  type: type
  time: time
  mestamp: timestamp
  frame_cnt: frame_cnt
  x: x
  y: y
  z: z
  rawdata0: rawdata0
  rawdata1: rawdata1
  rawdata2: rawdata2
  rawdata3: rawdata3
  ipd_pa0: ipd_pa0
  ipd_pa1: ipd_pa1
  ipd_pa2: ipd_pa2
  ipd_pa3: ipd_pa3
  agc_info0: agc_info0
  agc_info1: agc_info1
  agc_info2: agc_info2
  agc_info3: agc_info3
  spo2: spo2
  r_val: r_val
  valid_level: valid_level
  confi_coeff: confi_coeff
  hb_mean: hb_mean
  hb_confi_lvl: hb_confi_lvl
  invalidFlg: invalidFlg
  calc_flg: calc_flg
  ref_spo2: ref_spo2_0
  

extra_source:
  description: 血氧金标CSV；不依赖文件名，通过必备列识别，并通过时间列对齐到原始数据time列
  pattern: '*.csv'
  required_columns:
    - 时间
  any_required_columns:
    - SpO2
    - O2 饱和度
  csv:
    header_row: 1
    data_start_row: 2
    delimiter: ','
  align:
    left_on: time
    right_on: 时间
    right_extract: '(\d{2}:\d{2}:\d{2})'
  column_mapping:
    SpO2: ref_spo2
    O2 饱和度: ref_spo2
    ref_spo2: ref_spo2

forward_fill: 
  - spo2
  - r_val
  - valid_level
  - confi_coeff
  - hb_mean
  - hb_confi_lvl
  - invalidFlg
  - calc_flg
# expand_repeat: []  # 重复扩展列（如 [REF_RESULT{0-15}]）
