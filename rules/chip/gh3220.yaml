version: "1.0"
chip: gh3220

csv:
  info_row: 1            # 信息所在行
  header_row: 2          # 列名所在行（0表示无列名）
  data_start_row: 3      # 数据开始行
  delimiter: ","         # 分隔符
  encoding: "utf-8"      # 编码
  info: "Version: GH3220"  # 信息

columns:                 # 列定义（按顺序）
    - TimeStamp
    - FRAME_ID
    - ACCX
    - ACCY
    - ACCZ
    - CH{0-15}
    - FLAG{0-7}
    - REF_RESULT{0-15}
    - ALGO_RESULT{0-7}
    - AGC_INFO_CH{0-15}
    - AMB_CH{0-15}
    - GYRO_X
    - GYRO_Y
    - GYRO_Z
    - CH16-31
    - ALGO_RESULT{8-15}
    - AGC_INFO_CH{16-31}
    - CAP_CH{0-3}
    - TEMP_CH{0-3}

snr_columns:             # SNR/CTR/Noise 计算列（自动过滤全零列）
    - CH{0-15}
    - CH{16-31}

snr_config:              # SNR 计算参数
    sample_rate: 100     # 采样率 Hz
    skip_head_seconds: 10  # 剔除前 N 秒不稳定数据
    skip_tail_seconds: 10  # 剔除后 N 秒不稳定数据
    min_duration_seconds: 90  # 最小数据时长（秒），不满足则跳过
