version: "1.0"
chip: gh3036

csv:
  info_row: 1            # 信息所在行
  header_row: 2          # 列名所在行（0表示无列名）
  data_start_row: 3      # 数据开始行
  delimiter: ","         # 分隔符
  encoding: "utf-8"      # 编码
  info: "Version: GH3036"  # 信息

columns:                 # 列定义（按顺序）
    - TimeStamp
    - FRAME_ID
    - ACCX
    - ACCY
    - ACCZ
    - Ipd{0-31}
    - FLAG{0-7}
    - REF_RESULT{0-15}
    - ALGO_RESULT{0-15}
    - Rawdata{0-31}
    - AGC_INFO_CH{0-31}
    - LED_INFO_CH{0-31}
    - GYRO_X
    - GYRO_Y
    - GYRO_Z

snr_columns:             # SNR/CTR/Noise 计算列（自动过滤全零列）
    - Rawdata{0-31}

