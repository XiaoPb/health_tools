name: CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: ruff check src/

    - name: Format check with black
      run: black --check --fast src/

    - name: Run tests
      run: pytest --cov=health_tools --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  package-windows:
    needs: test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install packaging dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]" pyinstaller

    - name: Build standalone executable
      shell: pwsh
      run: pyinstaller --clean --noconfirm ghealth_tools.spec

    - name: Smoke test executable
      shell: pwsh
      run: |
        $exe = "dist\ghealth-tools-windows-x64.exe"
        if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
          throw "Executable not found: $exe"
        }
        & $exe --help
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & $exe --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Create and verify zip
      shell: pwsh
      run: |
        $exe = "dist\ghealth-tools-windows-x64.exe"
        $zip = "dist\ghealth-tools-windows-x64.zip"
        Compress-Archive -Path $exe -DestinationPath $zip -CompressionLevel Optimal
        $extract = Join-Path $env:RUNNER_TEMP "ghealth-tools-windows-x64"
        New-Item -ItemType Directory -Path $extract -Force | Out-Null
        Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
        $files = @(Get-ChildItem -LiteralPath $extract -File -Recurse)
        if ($files.Count -ne 1 -or $files[0].Name -ne "ghealth-tools-windows-x64.exe") {
          throw "Zip must contain exactly ghealth-tools-windows-x64.exe"
        }
        & $files[0].FullName --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload Windows executable artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: |
          dist/ghealth-tools-windows-x64.exe
          dist/ghealth-tools-windows-x64.zip

  release:
    needs: [build, package-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'rc') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha')

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Download Windows executable artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-executable
        path: dist/

    - name: Generate release notes
      id: notes
      run: |
        PREV_TAG=$(git tag --sort=-creatordate | grep -v "$(git describe --tags --abbrev=0)" | head -1)
        if [ -z "$PREV_TAG" ]; then
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s" ${PREV_TAG}..HEAD >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
        body: |
          ## Installation

          ```bash
          pip install ghealth-tools
          ```

          Or download the wheel/sdist from the assets below.

          Windows users can download `ghealth-tools-windows-x64.exe` directly without
          installing Python, or download `ghealth-tools-windows-x64.zip` containing
          the same executable. The `offline` command still requires the external
          `TEE_Algorithm.exe` configured separately.

          ## Changes

          ${{ steps.notes.outputs.NOTES }}

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'rc') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha')

    environment:
      name: pypi
      url: https://pypi.org/p/ghealth-tools

    permissions:
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && (contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha'))

    environment:
      name: testpypi
      url: https://test.pypi.org/p/ghealth-tools

    permissions:
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
