version: "1.0"
description: "转换规则模板 - 将自定义格式转换为目标芯片格式"

# 指定目标芯片（对应 rules/chip/<chip>.yaml）
target_chip: gh3220

csv:
  info_row: 0            # 信息所在行
  header_row: 1          # 列名所在行（0表示无列名）
  data_start_row: 2      # 数据开始行
  delimiter: ","         # 分隔符

# 列映射：源列名 -> 目标列名
# 展开语法：name{start-end} 展开为 name0, name1, ...
# 含 [] 的列名直接写即可，如 acc[0] 是字面量列名
column_mapping:
  time: TimeStamp
  frame_cnt: FRAME_ID
  acc[0]: ACCX
  acc[1]: ACCY
  acc[2]: ACCZ
  rawdata{0-15}: CH{0-15}

# 前值填充：指定列在首个非0值出现后，后续0值用前一个非0值填充
# 例如 [0,0,3,0,0,4,0,0,5] -> [0,0,3,3,3,4,4,4,5]
# forward_fill:
#   - polar_HR
#   - hba_out

# 时间步进扩展：指定列每个值重复N次以匹配其他列的采样频率
# 例如其他列25行/秒，polar_HR为1行/秒，设置25则自动重复扩展
# expand_repeat:
#   polar_HR: 25

# 可选：计算列（通过公式生成新列）
# computed:
#   FLAG0: "status * 1"
#   TEMP: "raw_temp / 100"
# split: 先分割再转换；每个 split 段独立执行 forward_fill，避免段间串值
# split:
#   by_column: frame_cnt  # 列值等于 column_value 时开始新段；须为映射前的源列名
#   column_value: 0
# split:
#   by_size: 1000         # 按行数分割
# split:
#   by_time: 60           # 按时间分割（秒）；time_column 须为映射前的源列名
#   time_column: time

# classify: 转换完成后分类并输出到 {输出目录}/{类别路径}/{输出文件名}
# 支持完整 classify 规则参数：filename/path/data_columns/structure/rules、extract/classify、default、rename
# classify:
#   default: unclassified
#   extract:
#     - name: spo2_median
#       function: calculate_median
#       params:
#         column: REF_RESULT5   # 转换后的目标列名
#   classify:
#     - target: normal
#       condition: 'spo2_median >= 95'
#     - target: lowspo2
#       condition: 'spo2_median < 95'
# 文件名重分类与重命名示例：
# classify:
#   filename:
#     regex: '(?P<motion>sit|walk).*\.csv'
#   structure:
#     sit: ''
#     walk: ''
#   rules:
#     - target: '{motion}'
#   rename: '{motion}_{filename}'
