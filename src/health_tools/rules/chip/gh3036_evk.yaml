version: "1.0"
chip: gh3036_evk

csv:
  info_row: 0            # 信息所在行
  header_row: 1          # 列名所在行（0表示无列名）
  data_start_row: 2      # 数据开始行
  delimiter: ","         # 分隔符
  encoding: "utf-8"      # 编码

columns:                 # 列定义（按顺序）
    - TimeStamp
    - FRAME_ID
    - ACCX
    - ACCY
    - ACCZ
    - slotcfg{0-7}rx{0-1}
    - FLAG{0-7}
    - slotcfg{0-7}rx{0-1}_agcinfo
    - slotcfg{0-7}rx{0-1}_ledinfo
    - GYRO_X
    - GYRO_Y
    - GYRO_Z
    - slotcfg{0-7}rx{0-1}_physics

snr_columns:             # SNR/CTR/Noise 计算列（自动过滤全零列）
    - slotcfg{0-7}rx{0-1}

snr_config:              # SNR 计算参数
    sample_rate: 100     # 采样率 Hz
    skip_head_seconds: 10  # 剔除前 N 秒不稳定数据
    skip_tail_seconds: 10  # 剔除后 N 秒不稳定数据
    min_duration_seconds: 90  # 最小数据时长（秒），不满足则跳过

gain_tia_map:
  unit: "KΩ"
  map:
    0: 10
    1: 25
    2: 50
    3: 100
    4: 250
    5: 500
    6: 1000

chip_info:
  adc_full_scale: 8388608
  adc_offset: 0

  gain:
    source: "slotcfg{0-7}rx{0-1}_agcinfo"
    bits: "[3:0]"       # 低4位
    type: "int"
    unit: ""
    desc: "增益等级"

  bg_cancel_level:
    source: "slotcfg{0-7}rx{0-1}_agcinfo"
    bits: "[5:4]"
    type: "int"
    unit: ""
    desc: "背景抵消等级"

  dc_cancel_level:
    source: "slotcfg{0-7}rx{0-1}_agcinfo"
    bits: "[7:6]"
    type: "int"
    unit: ""
    desc: "DC抵消等级"

  dc_cancel_code:
    source: "slotcfg{0-7}rx{0-1}_agcinfo"
    bits: "[15:8]"
    type: "int"
    unit: ""
    desc: "DC抵消校准码"

  led_current_sum:
    source: "slotcfg{0-7}rx{0-1}_agcinfo"
    bits: "[29:16]"
    type: "int"
    unit: "0.1mA"
    desc: "LED总电流"

  led_current_drv0:
    source: "slotcfg{0-7}rx{0-1}_ledinfo"
    bits: "[11:0]"
    type: "int"
    unit: "0.1mA"
    desc: "DRV0通道电流"

  led_current_drv1:
    source: "slotcfg{0-7}rx{0-1}_ledinfo"
    bits: "[23:12]"
    type: "int"
    unit: "0.1mA"
    desc: "DRV1通道电流"

  led_current_drv3:
    optional: true

  led_current_drv4:
    optional: true

  ipd_pA:
    source: "slotcfg{0-7}rx{0-1}_physics"
    bits: null        # 整列使用，无位段
    type: "float"
    unit: "pA"
    desc: "光电流值"
