version: "1.0"
chip: gh3220

csv:
  info_row: 1            # 信息所在行
  header_row: 2          # 列名所在行（0表示无列名）
  data_start_row: 3      # 数据开始行
  delimiter: ","         # 分隔符
  encoding: "utf-8"      # 编码
  info: "Version: GH3220"  # 信息

columns:                 # 列定义（按顺序）
    - TimeStamp
    - FRAME_ID
    - ACCX
    - ACCY
    - ACCZ
    - CH{0-15}
    - FLAG{0-7}
    - REF_RESULT{0-15}
    - ALGO_RESULT{0-7}
    - AGC_INFO_CH{0-15}
    - AMB_CH{0-15}
    - GYRO_X
    - GYRO_Y
    - GYRO_Z
    - CH16-31
    - ALGO_RESULT{8-15}
    - AGC_INFO_CH{16-31}
    - CAP_CH{0-3}
    - TEMP_CH{0-3}

factory_columns:             # SNR/CTR/Noise 计算列（自动过滤全零列）
    - CH{0-15}
    - CH{16-31}

factory_config:              # SNR 计算参数
  sample_rate: 100     # 采样率 Hz
  snr:
      skip_head_seconds: 10  # 剔除前 N 秒不稳定数据
      skip_tail_seconds: 10  # 剔除后 N 秒不稳定数据
      min_duration_seconds: 90  # 最小数据时长（秒），不满足则跳过
  ctr:
      skip_head_seconds: 1  # 剔除前 N 秒不稳定数据
      skip_tail_seconds: 0  # 剔除后 N 秒不稳定数据
      min_duration_seconds: 2  # 最小数据时长（秒），不满足则跳过
  noise:
      skip_head_seconds: 2  # 剔除前 N 秒不稳定数据
      skip_tail_seconds: 0  # 剔除后 N 秒不稳定数据
      min_duration_seconds: 4  # 最小数据时长（秒），不满足则跳过

gain_tia_map:
  unit: "KΩ"
  map:
    0: 10
    1: 25
    2: 50
    3: 100
    4: 250
    5: 500
    6: 1000

chip_info:
  adc_full_scale: 8388608
  adc_offset: 8388608
  adc_vref: 1.8
  tia_ratio: 2

  gain:
    source: "AGC_INFO_CH{0-31}"
    bits: "[3:0]"
    type: "int"
    unit: ""
    desc: "增益等级"

  bg_cancel_level:
    source: "AGC_INFO_CH{0-31}"
    bits: "[5:4]"
    type: "int"
    unit: ""
    desc: "背景抵消等级"

  dc_cancel_level:
    source: "AGC_INFO_CH{0-31}"
    bits: "[7:6]"
    type: "int"
    unit: ""
    desc: "DC抵消等级"

  dc_cancel_code:
    source: "AGC_INFO_CH{0-31}"
    bits: "[31:23]"
    type: "int"
    unit: ""
    desc: "DC抵消校准码"

  led_cur rent_sum:
    optional: true

  led_current_drv0:
    source: "AGC_INFO_CH{0-31}"
    bits: "[15:8]"
    type: "int"
    unit: "0.784mA/LSB"
    desc: "DRV0通道电流"

  led_current_drv1:
    source: "AGC_INFO_CH{0-31}"
    bits: "[23:16]"
    type: "int"
    unit: "0.784mA/LSB"
    desc: "DRV1通道电流"

  led_current_drv3:
    optional: true

  led_current_drv4:
    optional: true
