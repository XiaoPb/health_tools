version: "1.0"
type: spo2
description: 血氧原始数据、光学通道与准确度诊断
columns:
  reference: REF_RESULT5
  prediction: ALGO_RESULT5
  timestamp: TimeStamp
  ppg_patterns: ["^Ipd\\d+$", "^CH\\d+$", "^Rawdata\\d+$"]
  acc: [ACCX, ACCY, ACCZ]
detectors: [integrity, raw_signal, reference, accuracy, motion, channel_consistency]
sampling:
  sample_rate: 25
  infer_timestamp_unit: auto
thresholds:
  missing_ratio: 0.01
  flat_ratio: 0.98
  saturation_ratio: 0.01
  baseline_drift_ratio: 0.50
  pi_low: 0.5
  motion_rms: 0.10
  error: 3
  error_min_seconds: 5
  ref_min: 70
  ref_max: 100
  ref_valid_ratio: 0.80
  ref_stale_seconds: 120
  ref_jump_per_second: 5
  jump_per_second: 5
  channel_correlation: 0.30
offline:
  enabled: false
causes:
  - id: reference_invalid
    title: 参考血氧无效或时间轴异常
    origin: reference
    priority: 100
    when: {feature: reference_valid, op: eq, value: false}
  - id: data_incomplete
    title: 原始数据缺失、断帧或时间戳异常
    origin: raw
    priority: 95
    when: {feature: data_complete, op: eq, value: false}
    actions: [检查采集链路、参考设备和时间对齐后重新采集]
  - id: motion_excessive
    title: SpO2 仅支持静止测试，当前运动幅度过大
    origin: raw
    priority: 94
    when: {feature: motion_excessive, op: eq, value: true}
    actions: [保持受测者和佩戴部位静止，确认设备稳定贴肤后重新采集]
  - id: data_range_invalid
    title: check 检测到原始数据范围异常
    origin: raw
    priority: 93
    when: {feature: check_range_failed, op: eq, value: true}
    actions: [核对芯片量程、数据格式和采集状态后重新采集]
  - id: acc_invalid
    title: check 检测到 ACC 全零、静止或循环异常
    origin: raw
    priority: 92
    when: {feature: check_acc_failed, op: eq, value: true}
    actions: [检查 ACC 传感器和数据链路后重新采集]
  - id: signal_conversion_invalid
    title: check 检测到数据居中或 Ipd 转换异常
    origin: raw
    priority: 91
    when: {feature: check_signal_failed, op: eq, value: true}
    actions: [核对原始码、Ipd 转换和芯片规则后重新采集]
  - id: signal_saturated
    title: 光学通道饱和或削顶
    origin: raw
    priority: 90
    when: {feature: signal_saturated, op: eq, value: true}
    actions: [调整佩戴位置和接触压力，重新采集未饱和的双波长数据]
  - id: low_perfusion
    title: 静止 SpO2 光学灌注不足
    origin: raw
    priority: 89
    when:
      all:
        - {feature: scene, op: eq, value: static}
        - {feature: pi_low, op: eq, value: true}
    actions: [保持末梢温暖并稳定佩戴，待 PI 恢复后重新采集]
  - id: signal_flat
    title: 光学通道平线或未有效接触
    origin: raw
    priority: 88
    when: {feature: signal_flat, op: eq, value: true}
    actions: [确认红光和红外通道均有效并稳定贴肤后重新采集]
  - id: channel_inconsistent
    title: 双波长信号一致性不足
    origin: raw
    priority: 82
    when: {feature: channel_inconsistent, op: eq, value: true}
    actions: [检查遮光、佩戴位置和双波长通道有效性后重新采集]
  - id: baseline_drift
    title: 光学原始信号存在明显基线漂移
    origin: raw
    priority: 78
    when: {feature: baseline_drift, op: eq, value: true}
    actions: [检查佩戴松动、缓慢位移和遮光条件后重新采集]
  - id: unexplained_algorithm_error
    title: 原始数据与参考有效但算法结果持续异常
    origin: algorithm
    priority: 50
    when:
      all:
        - {feature: raw_valid, op: eq, value: true}
        - {feature: reference_valid, op: eq, value: true}
        - {feature: algorithm_abnormal, op: eq, value: true}
